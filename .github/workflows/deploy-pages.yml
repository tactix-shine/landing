# Publishes the static site in tactix-site/ to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Copy public files only
        run: >
          rsync -a tactix-site/ _site/
          --exclude README.md --exclude DESIGN.md --exclude 'check*.cjs' --exclude preview.html --exclude 'header-*.html'
          --exclude previews --exclude brochure --exclude .DS_Store
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
      - id: deployment
        uses: actions/deploy-pages@v4
