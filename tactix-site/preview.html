<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tactix | Desktop and phone design preview</title>
<style>
@font-face{font-family:Montserrat;src:url('assets/montserrat-regular.ttf')}@font-face{font-family:Montserrat;src:url('assets/montserrat-semibold.ttf');font-weight:600}
*{box-sizing:border-box}body{margin:0;background:#edf1f6;color:#1d4789;font:14px/1.5 Montserrat,Arial,sans-serif}a{color:inherit;text-underline-offset:4px}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #1d4789;outline-offset:4px}.toolbar{padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:white;border-bottom:1px solid #bdcde2;flex-wrap:wrap}.title{font-weight:600}.title span{font-weight:400;margin-left:14px;font-size:12px}.modes{display:flex;gap:4px;padding:4px;border-radius:8px;background:#edf1f6}.modes button{border:0;background:transparent;color:#1d4789;padding:9px 18px;border-radius:5px;min-height:40px}.modes button[aria-pressed=true]{background:#1d4789;color:white}.open-link{font-size:12px;min-height:44px;display:flex;align-items:center}.preview-meta{max-width:1500px;margin:22px auto 14px;padding:0 24px;display:flex;justify-content:space-between;gap:20px;font-size:12px}.available{margin:0 24px 32px}.stage{position:relative;margin:0 auto;box-shadow:0 10px 32px #18386218;overflow:hidden;background:white}iframe{display:block;border:0;transform-origin:top left;background:white}.note{font-size:12px;text-align:center;padding:0 24px 22px;color:#4d607b}.phone .stage{outline:7px solid #173963;border-radius:24px;margin-top:22px}.phone iframe{border-radius:20px}@media(max-width:640px){.toolbar{padding:14px 18px;gap:12px}.title{width:100%}.title span{margin-left:8px}.modes button{padding:9px 14px}.available{margin-inline:14px}.preview-meta{padding-inline:14px}.preview-meta span:last-child{display:none}}
</style>
</head>
<body>
<header class="toolbar"><div class="title">Tactix <span>Precision in white</span></div><div class="modes" role="group" aria-label="Preview size"><button type="button" data-mode="desktop" aria-pressed="true">Desktop</button><button type="button" data-mode="phone" aria-pressed="false">Phone</button></div><a class="open-link" href="index.html" target="_blank" rel="noopener">Open full page</a></header>
<div class="preview-meta"><span id="size-label" aria-live="polite">Desktop · 1440 × 1000</span><span>Scroll inside the preview to see all sections.</span></div>
<div class="available"><div class="stage"><iframe src="index.html" title="Tactix responsive website mockup" width="1440" height="1000"></iframe></div></div>
<p class="note">Layout mockup. Phone and email links work. Enquiry forms are reserved for a later phase.</p>
<script>
  const frame=document.querySelector('iframe');
  frame.src='index.html'+location.hash;
  const stage=document.querySelector('.stage');
  const available=document.querySelector('.available');
  const sizes={desktop:[1440,1000],phone:[390,844]};
  let mode='desktop';
  function fit(){
    const [width,height]=sizes[mode];
    const scale=Math.min(1,available.clientWidth/width);
    frame.style.width=width+'px';frame.style.height=height+'px';
    frame.style.transform='scale('+scale+')';
    stage.style.width=width*scale+'px';stage.style.height=height*scale+'px';
  }
  document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{
    mode=button.dataset.mode;
    document.body.classList.toggle('phone',mode==='phone');
    document.querySelectorAll('[data-mode]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    document.querySelector('#size-label').textContent=(mode==='phone'?'Phone':'Desktop')+' · '+sizes[mode].join(' × ');
    fit();
  }));
  new ResizeObserver(fit).observe(available);
  fit();
</script>
</body>
</html>
